spring:
  config:
    import: "optional:file:./.env[.properties]"

  application:
    name: ttareureung-server

  profiles:
    active: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# 초대 링크 등 프론트 주소가 들어가는 응답용
app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000
  cookie:
    secure: ${JWT_COOKIE_SECURE:true}
    # 프론트(vercel.app)와 서버 도메인이 달라 Lax면 refresh 요청에 쿠키 미전송. None은 Secure(https) 필수
    same-site: ${JWT_COOKIE_SAME_SITE:None}

springdoc:
  swagger-ui:
    with-credentials: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  # 3.8-flash는 과부하 시 503·장시간 대기. 3.5-flash-lite가 판독 정확도 동일 수준에 1~7초
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

# 웹 푸시(VAPID). 두 키가 있어야 발송·스케줄러 동작. 키 생성 방법은 .env.example 참고
push:
  vapid-public-key: ${VAPID_PUBLIC_KEY:}
  vapid-private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:admin@ttareureung.store}

# 사진 저장소. s3.bucket이 있으면 S3, 없으면 서버 디스크(local.dir)
storage:
  url-ttl-minutes: 60
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
  local:
    dir: ${FILE_STORAGE_DIR:${java.io.tmpdir}/ttareureung-uploads}