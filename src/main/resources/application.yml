spring:
  config:
    import: "optional:file:./.env[.properties]"

  application:
    name: ttareureung-server

  profiles:
    active: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# 초대 링크 등 프론트 주소가 들어가는 응답용
app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000
  cookie:
    secure: ${JWT_COOKIE_SECURE:true}
    same-site: ${JWT_COOKIE_SAME_SITE:Lax}

springdoc:
  swagger-ui:
    with-credentials: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

# 사진 저장소. s3.bucket이 있으면 S3, 없으면 서버 디스크(local.dir)
storage:
  url-ttl-minutes: 60
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
  local:
    dir: ${FILE_STORAGE_DIR:${java.io.tmpdir}/ttareureung-uploads}