spring:
  datasource:
    # DB_URL이 있으면(.env, CI) 그 값, 없으면(docker compose) 컨테이너 MySQL
    url: ${DB_URL:jdbc:mysql://ttareureung-mysql:3306/ttareureung_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: update
    show-sql: true
    properties.hibernate.format_sql: true
server.port: 8080